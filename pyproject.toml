[tool.pylint.main]
py-version = "3.10"

[tool.pylint.design]
max-args = 6

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.coverage.run]
source = ["core"]
branch = true
