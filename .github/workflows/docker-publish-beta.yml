name: Publish Docker beta image

# Beta tags (1.2.3-beta) always build. Pushes to develop only build when something that ends up in
# the image changed (path filters are not applied to tags).
on:
  push:
    tags:
      - '*.*.*-beta'
    branches:
      - develop
    paths:
      - 'core/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish-beta.yml'
  workflow_dispatch:

concurrency:
  group: docker-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: twoplay/craftybot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        run: |
          echo "GHCR_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          # Only beta tags get a version tag, develop pushes only update beta
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          TAGS="beta${VERSION:+ $VERSION}"
          ARGS=""
          for tag in $TAGS; do ARGS="$ARGS -t $IMAGE_NAME:$tag -t $GHCR_IMAGE:$tag"; done
          docker build $ARGS .
          for tag in $TAGS; do
            docker push "$IMAGE_NAME:$tag"
            docker push "$GHCR_IMAGE:$tag"
          done
